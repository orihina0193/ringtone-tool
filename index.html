<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ringtone Ignition v2.0</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { 
    background: #111111; 
    color: #eeeeee; 
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    margin: 0; 
    padding: 12px;
  }
  .panel { 
    background: #1c1c1c; 
    border: 2px solid #333333; 
    padding: 14px; 
    border-radius: 16px; 
    width: 100%; 
    max-width: 520px; 
    text-align: center; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  
  /* 上部ヘッダー */
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .app-title { font-size: 1.1rem; font-weight: 900; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
  .app-ver { font-size: 0.65rem; color: #00f0ff; background: rgba(0,240,255,0.1); border: 1px solid rgba(0,240,255,0.3); padding: 1px 5px; border-radius: 4px; }
  .sample-btn { background: #332200; color: #ffd700; border: 1px solid #aa8800; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  .sample-btn:hover { background: #443300; }
  
  /* ファイル選択 */
  .select-btn { 
    width: 100%; 
    height: 46px; 
    background: #242424; 
    color: #00f0ff; 
    border: 2px solid #00f0ff; 
    font-size: 15px; 
    border-radius: 10px; 
    font-weight: bold; 
    cursor: pointer; 
    box-shadow: 0 0 10px rgba(0,240,255,0.2); 
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .select-btn:hover { background: #2e2e2e; }
  .file-badge { font-size: 11px; color: #888; margin-top: 6px; word-break: break-all; }

  /* 時間表示 */
  .time { font-size: 2.8rem; color: #00f0ff; font-weight: 900; margin: 4px 0 2px; text-shadow: 0 0 12px rgba(0,240,255,0.6); font-variant-numeric: tabular-nums; line-height: 1; }
  .range-info { font-size: 0.95rem; font-weight: bold; color: #fff; margin-bottom: 2px; }
  .range-in { color: #ff007f; text-shadow: 0 0 6px rgba(255,0,127,0.4); }
  .range-out { color: #00f0ff; text-shadow: 0 0 6px rgba(0,240,255,0.4); }
  .alert-info { font-size: 0.8rem; color: #ff4444; font-weight: bold; min-height: 1.3em; margin: 2px 0; }
  
  /* 波形 & シークバー */
  #wf-canvas { width: 100%; height: 56px; background: #121212; border: 1px solid #2a2a2a; border-radius: 8px; cursor: pointer; display: block; }
  input[type=range] { width: 100%; margin: 8px 0 10px; accent-color: #00f0ff; cursor: pointer; }
  
  /* ボタングループ */
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  button { 
    background: #2a2a2a; color: #eee; border: 1px solid #444; 
    padding: 0; border-radius: 8px; font-weight: bold; 
    font-size: 13px; cursor: pointer; 
    -webkit-tap-highlight-color: transparent; 
    height: 42px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  
  .side-btn { flex: 1 1 20%; font-size: 12px; }
  .center-btn { flex: 1 1 45%; font-size: 14px; }
  .large-btn { flex: 1 1 95% !important; font-size: 13px; height: 36px; margin-bottom: 2px; }
  
  .accent-in { background: #381636; color: #ff80df; border-color: rgba(255,0,127,0.6); }
  .accent-in.center-btn { background: #591852; color: #fff; border: 2px solid #ff007f; box-shadow: 0 0 8px rgba(255,0,127,0.3); }
  .accent-out { background: #163638; color: #80f5ff; border-color: rgba(0,240,255,0.6); }
  .accent-out.center-btn { background: #185559; color: #fff; border: 2px solid #00f0ff; box-shadow: 0 0 8px rgba(0,240,255,0.3); }

  /* フェード */
  .f-group { display: flex; width: 100%; gap: 5px; margin-top: 4px; }
  .f-btn { background: #222; border: 1px solid #444; color: #888; flex: 1 1 18%; font-size: 12px; height: 34px; }
  .f-btn.active { background: #555; color: #fff; border-color: #eee; box-shadow: 0 0 6px rgba(255,255,255,0.2); }
  
  /* ファイル名カスタマイズボックス */
  .filename-box { 
    width: 100%; 
    background: #161616; 
    border: 1px solid #383838; 
    border-radius: 10px; 
    padding: 10px; 
    margin-top: 8px; 
    text-align: left; 
  }
  .fn-label { font-size: 11px; font-weight: bold; color: #aaa; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .fn-input-wrap { display: flex; width: 100%; }
  .fn-input { 
    flex: 1; 
    background: #0a0a0a; 
    border: 2px solid #444; 
    color: #fff; 
    font-family: inherit; 
    font-size: 14px; 
    font-weight: bold; 
    padding: 8px 10px; 
    border-radius: 6px 0 0 6px; 
    outline: none; 
  }
  .fn-input:focus { border-color: #00f0ff; }
  .fn-ext { 
    background: #252525; 
    color: #00f0ff; 
    font-weight: bold; 
    padding: 8px 12px; 
    border: 2px solid #444; 
    border-left: none; 
    border-radius: 0 6px 6px 0; 
    display: flex; align-items: center; font-size: 14px;
  }
  .fn-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .fn-tag-btn { 
    background: #282828; color: #bbb; border: 1px solid #444; 
    font-size: 10px; padding: 2px 7px; height: 24px; border-radius: 4px; 
  }
  .fn-tag-btn:hover { background: #383838; color: #fff; }
  .fn-preview { font-size: 11px; color: #888; margin-top: 5px; word-break: break-all; }
  .fn-preview span { color: #00f0ff; font-weight: bold; }

  /* IGNITION 保存ボタン */
  .main { 
    background: linear-gradient(90deg, #006666, #008888); 
    color: #fff; 
    border: 2px solid #00f0ff; 
    flex: 1 1 95%; 
    font-size: 19px; 
    font-weight: 900; 
    margin-top: 10px; 
    height: 52px; 
    border-radius: 12px; 
    box-shadow: 0 0 15px rgba(0,240,255,0.3);
  }
  .main:hover { background: linear-gradient(90deg, #007777, #009999); }
  .main:disabled { background: #222; color: #555; border-color: #444; cursor: not-allowed; box-shadow: none; }
  
  #file-in { display: none; }
</style>
</head>
<body onclick="unlockAudio()">
  <div class="panel">
    <!-- ヘッダー -->
    <div class="header-row">
      <div class="app-title">
        <span>RINGTONE IGNITION</span>
        <span class="app-ver">v2.0</span>
      </div>
      <button class="sample-btn" type="button" onclick="loadSampleTone()">⚡ サンプル音源</button>
    </div>

    <!-- SELECT MUSIC ボタン -->
    <button class="select-btn" type="button" onclick="unlockAudio(); document.getElementById('file-in').click()">
      🎵 SELECT MUSIC
    </button>
    <div id="file-badge" class="file-badge">音源ファイルを選択またはサンプルをロード</div>
    
    <!-- 時間表示 & 範囲表示 -->
    <div id="tm" class="time">00:00.00</div>
    <div class="range-info">
      <span class="range-in" id="in-val">IN: 0.00s</span> / 
      <span class="range-out" id="out-val">OUT: 0.00s</span>
      <span id="len-val" style="color:#aaa; font-size:0.85em;">(0.00s)</span>
    </div>
    <div id="alert-msg" class="alert-info"></div>

    <!-- 波形キャンバス & シークバー -->
    <canvas id="wf-canvas" width="500" height="56"></canvas>
    <input type="range" id="sk" value="0" step="0.01" oninput="manualSeek(this.value)">
    
    <!-- 操作ボタン一覧 -->
    <div class="btns">
      <button style="flex:1 1 18%" type="button" onclick="skip(-5)">-5s</button>
      <button style="flex:1 1 18%" type="button" onclick="skip(-1)">-1s</button>
      <button style="flex:1 1 36%; background:#444; font-size:15px;" id="pp-btn" type="button" onclick="pp()">PLAY</button>
      <button style="flex:1 1 18%" type="button" onclick="skip(1)">+1s</button>
      <button style="flex:1 1 18%" type="button" onclick="skip(5)">+5s</button>
      
      <!-- START IN 調整 -->
      <button class="accent-in side-btn" type="button" onclick="adj('s',-0.1)">IN-0.1</button>
      <button class="accent-in center-btn" type="button" onclick="st('s')">SET START</button>
      <button class="accent-in side-btn" type="button" onclick="adj('s',0.1)">IN+0.1</button>
      <button class="accent-in large-btn" type="button" onclick="backToStart()">⏮ STARTへ戻る</button>
      
      <!-- END OUT 調整 -->
      <button class="accent-out side-btn" type="button" onclick="adj('e',-0.1)">OUT-0.1</button>
      <button class="accent-out center-btn" type="button" onclick="st('e')">SET END</button>
      <button class="accent-out side-btn" type="button" onclick="adj('e',0.1)">OUT+0.1</button>
      <button class="accent-out large-btn" type="button" onclick="previewEnd()">⏭ END 3秒前再生</button>
      
      <!-- FADE OUT 設定 -->
      <div class="f-group">
        <button class="f-btn active" id="f0" type="button" onclick="setFade(0)">FADE:OFF</button>
        <button class="f-btn" id="f1" type="button" onclick="setFade(1)">1s</button>
        <button class="f-btn" id="f2" type="button" onclick="setFade(2)">2s</button>
        <button class="f-btn" id="f3" type="button" onclick="setFade(3)">3s</button>
        <button class="f-btn" id="f5" type="button" onclick="setFade(5)">5s</button>
      </div>

      <!-- 保存ファイル名設定 -->
      <div class="filename-box">
        <div class="fn-label">
          <span>🏷️ 保存ファイル名 (Custom Filename)</span>
          <span>16-bit WAV</span>
        </div>
        <div class="fn-input-wrap">
          <input type="text" id="fn-input" class="fn-input" value="ringtone" oninput="updateFilenamePreview()" placeholder="ファイル名を入力">
          <div class="fn-ext">.wav</div>
        </div>
        <div class="fn-tags">
          <button type="button" class="fn-tag-btn" onclick="appendTag('_alarm')">+_alarm</button>
          <button type="button" class="fn-tag-btn" onclick="appendTag('_ringtone')">+_ringtone</button>
          <button type="button" class="fn-tag-btn" onclick="appendDateTag()">+日付</button>
          <button type="button" class="fn-tag-btn" onclick="resetFilename()">元に戻す</button>
        </div>
        <div class="fn-preview">出力名: <span id="fn-preview-txt">ringtone.wav</span></div>
      </div>
      
      <!-- IGNITION ボタン -->
      <button id="ig" class="main" type="button" onclick="exportAudio()" disabled>IGNITION (保存)</button>
    </div>
  </div>

  <input type="file" id="file-in">

<script>
  let aCtx = new (window.AudioContext || window.webkitAudioContext)();
  let aBuf = null, sNode = null, gNode = null;
  let sT = 0, eT = 0, fade = 0, isP = false, pStart = 0, offset = 0;
  let originalBaseName = "ringtone";
  
  const sk = document.getElementById('sk');
  const wfCanvas = document.getElementById('wf-canvas');
  const fnInput = document.getElementById('fn-input');

  function unlockAudio() { 
    if (aCtx.state === 'suspended') aCtx.resume(); 
  }

  // ファイル読み込み
  document.getElementById('file-in').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('alert-msg').innerText = "DECODING AUDIO...";
    try {
      const arrayBuffer = await file.arrayBuffer();
      const decoded = await aCtx.decodeAudioData(arrayBuffer);
      const monoBuf = aCtx.createBuffer(1, decoded.length, decoded.sampleRate);
      const monoData = monoBuf.getChannelData(0);
      if (decoded.numberOfChannels > 1) {
        const left = decoded.getChannelData(0), right = decoded.getChannelData(1);
        for (let i = 0; i < decoded.length; i++) monoData[i] = (left[i] + right[i]) / 2;
      } else { 
        monoData.set(decoded.getChannelData(0)); 
      }
      
      aBuf = monoBuf;
      sk.max = aBuf.duration;
      sT = 0; 
      eT = Math.min(aBuf.duration, 30); 
      offset = 0;
      
      // ファイル名初期設定
      originalBaseName = sanitizeName(file.name);
      fnInput.value = originalBaseName ? originalBaseName + "_ringtone" : "ringtone";
      document.getElementById('file-badge').innerText = file.name + " (" + aBuf.duration.toFixed(1) + "s)";
      
      document.getElementById('alert-msg').innerText = "";
      updateInfo();
      drawWaveform();
    } catch (err) { 
      document.getElementById('alert-msg').innerText = "ERROR: 音声のデコードに失敗しました"; 
    }
  };

  // テスト用サンプル音源の生成
  async function loadSampleTone() {
    unlockAudio();
    stopAudio();
    document.getElementById('alert-msg').innerText = "GENERATING SAMPLE TONE...";
    
    const sr = aCtx.sampleRate;
    const dur = 12.0;
    const buf = aCtx.createBuffer(1, Math.floor(sr * dur), sr);
    const data = buf.getChannelData(0);
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 587.33, 698.46, 880.0, 1174.66, 659.25, 783.99, 987.77, 1318.51, 1046.5];
    const beat = 60 / 140;

    for(let i = 0; i < data.length; i++) {
      const t = i / sr;
      const nIdx = Math.floor((t / (beat / 2)) % notes.length);
      const freq = notes[nIdx];
      const env = Math.max(0, 1 - ((t % (beat / 2)) / (beat / 2)) * 1.6);
      const wave = Math.sin(2 * Math.PI * freq * t) > 0 ? 0.25 : -0.25;
      const kick = Math.sin(2 * Math.PI * Math.max(40, 140 * (1 - (t % beat) * 4)) * t) * Math.exp(-(t % beat) * 8) * 0.4;
      data[i] = (wave * env + kick) * 0.7;
    }

    aBuf = buf;
    sk.max = aBuf.duration;
    sT = 0;
    eT = aBuf.duration;
    offset = 0;
    originalBaseName = "sample_alarm";
    fnInput.value = "morning_alarm_sample";
    document.getElementById('file-badge').innerText = "synth_alarm_sample.wav (12.0s)";
    document.getElementById('alert-msg').innerText = "";
    updateInfo();
    drawWaveform();
  }

  // 再生停止
  function stopAudio() {
    if (sNode) {
      if (isP) offset = aCtx.currentTime - pStart + offset;
      try { sNode.stop(); } catch(e){}
      sNode.disconnect();
      if(gNode) gNode.disconnect();
      sNode = null; gNode = null;
    }
    isP = false;
    document.getElementById('pp-btn').innerText = "PLAY";
    document.getElementById('pp-btn').style.background = "#444";
  }

  // 再生・一時停止
  function pp() {
    if (!aBuf) return;
    unlockAudio();
    if (isP) { 
      stopAudio(); 
    } else {
      if (sNode) { sNode.disconnect(); sNode = null; }
      sNode = aCtx.createBufferSource();
      sNode.buffer = aBuf;
      gNode = aCtx.createGain();
      sNode.connect(gNode); 
      gNode.connect(aCtx.destination);
      
      if (offset >= eT || offset < sT) offset = sT;
      pStart = aCtx.currentTime;
      const remainingTime = eT - offset;
      
      if (fade > 0 && remainingTime > 0) {
        const fStart = Math.max(0, remainingTime - fade);
        gNode.gain.setValueAtTime(1, pStart);
        gNode.gain.setValueAtTime(1, pStart + fStart);
        gNode.gain.linearRampToValueAtTime(0.001, pStart + remainingTime);
      } else {
        gNode.gain.setValueAtTime(1, pStart);
      }
      
      sNode.start(0, offset, Math.max(0, remainingTime));
      isP = true;
      document.getElementById('pp-btn').innerText = "STOP";
      document.getElementById('pp-btn').style.background = "#d97706";
      
      const tick = () => {
        if (!isP) return;
        let now = aCtx.currentTime - pStart + offset;
        updateTimeDisplay(now);
        drawWaveform();
        if (now >= eT) { 
          isP = false; 
          stopAudio(); 
          offset = sT; 
          updateTimeDisplay(sT); 
          drawWaveform();
        } else { 
          requestAnimationFrame(tick); 
        }
      };
      tick();
    }
  }

  function manualSeek(v) { 
    stopAudio(); 
    offset = parseFloat(v); 
    updateTimeDisplay(offset); 
    drawWaveform(); 
  }
  
  function skip(v) { 
    if(!aBuf) return; 
    let wasP = isP; 
    stopAudio(); 
    offset = Math.min(aBuf.duration, Math.max(0, offset + v)); 
    updateTimeDisplay(offset); 
    drawWaveform();
    if (wasP) pp(); 
  }
  
  function adj(t, v) { 
    if(!aBuf) return; 
    if(t == 's') sT = Math.max(0, Math.min(eT - 0.05, sT + v)); 
    else eT = Math.min(aBuf.duration, Math.max(sT + 0.05, eT + v)); 
    updateInfo(); 
  }
  
  function st(t) { 
    if(!aBuf) return; 
    let now = isP ? aCtx.currentTime - pStart + offset : offset; 
    if(t=='s') sT = Math.max(0, Math.min(eT - 0.05, now)); 
    else eT = Math.min(aBuf.duration, Math.max(sT + 0.05, now)); 
    updateInfo(); 
  }
  
  function backToStart() { 
    stopAudio(); 
    offset = sT; 
    updateTimeDisplay(sT); 
    drawWaveform(); 
  }
  
  function previewEnd() { 
    if(!aBuf) return;
    stopAudio(); 
    offset = Math.max(sT, eT - 3); 
    pp(); 
  }
  
  function setFade(v) { 
    fade = v; 
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active')); 
    const el = document.getElementById('f'+v);
    if(el) el.classList.add('active'); 
    drawWaveform();
    if (isP) { 
      let c = aCtx.currentTime - pStart + offset; 
      stopAudio(); 
      offset = c; 
      pp(); 
    } 
  }

  function updateInfo() { 
    if(!aBuf) return;
    const editLen = Math.max(0, eT - sT);
    document.getElementById('in-val').innerText = "IN: " + sT.toFixed(2) + "s";
    document.getElementById('out-val').innerText = "OUT: " + eT.toFixed(2) + "s";
    document.getElementById('len-val').innerText = "(" + editLen.toFixed(2) + "s)";
    
    const alertMsg = document.getElementById('alert-msg');
    const ignition = document.getElementById('ig');
    
    if (editLen > 40) {
      alertMsg.innerText = "⚠️ 長すぎます (着信音・アラーム制限: 最大40s)";
      ignition.disabled = true;
    } else if (editLen <= 0) {
      alertMsg.innerText = "⚠️ STARTはENDより前に設定してください";
      ignition.disabled = true;
    } else {
      alertMsg.innerText = "";
      ignition.disabled = false;
    }
    updateTimeDisplay(isP ? aCtx.currentTime - pStart + offset : offset); 
    drawWaveform();
    updateFilenamePreview();
  }

  function updateTimeDisplay(t) { 
    let m = Math.floor(t / 60), s = (t % 60).toFixed(2); 
    document.getElementById('tm').innerText = String(m).padStart(2,'0') + ":" + s.padStart(5,'0'); 
    sk.value = t; 
  }

  // 波形描画
  function drawWaveform() {
    if (!aBuf) return;
    const ctx = wfCanvas.getContext('2d');
    const w = wfCanvas.width, h = wfCanvas.height;
    const dur = aBuf.duration;
    
    ctx.fillStyle = "#121212";
    ctx.fillRect(0, 0, w, h);

    // 選択区間背景
    const inX = (sT / dur) * w;
    const outX = (eT / dur) * w;
    ctx.fillStyle = "rgba(0, 240, 255, 0.1)";
    ctx.fillRect(inX, 0, outX - inX, h);

    // フェード区間
    if (fade > 0 && eT > sT) {
      const fX = Math.max(inX, ((eT - fade) / dur) * w);
      ctx.fillStyle = "rgba(255, 0, 255, 0.25)";
      ctx.fillRect(fX, 0, outX - fX, h);
    }

    // 波形バー描画
    const raw = aBuf.getChannelData(0);
    const bars = 80;
    const step = Math.floor(raw.length / bars);
    for (let i = 0; i < bars; i++) {
      let max = 0;
      for (let j = 0; j < step; j += 20) {
        let v = Math.abs(raw[i * step + j] || 0);
        if (v > max) max = v;
      }
      const bX = (i / bars) * w;
      const bH = Math.max(4, max * (h - 8));
      const bTime = (i / bars) * dur;
      
      if (bTime >= sT && bTime <= eT) {
        ctx.fillStyle = (fade > 0 && bTime >= eT - fade) ? "#ff44cc" : "#00f0ff";
      } else {
        ctx.fillStyle = "#444444";
      }
      ctx.fillRect(bX, (h - bH) / 2, Math.max(2, (w / bars) - 2), bH);
    }

    // INライン
    ctx.strokeStyle = "#ff007f"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(inX, 0); ctx.lineTo(inX, h); ctx.stroke();

    // OUTライン
    ctx.strokeStyle = "#00f0ff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(outX, 0); ctx.lineTo(outX, h); ctx.stroke();

    // 再生カーソル
    const curX = ((isP ? aCtx.currentTime - pStart + offset : offset) / dur) * w;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(curX, 0); ctx.lineTo(curX, h); ctx.stroke();
  }

  // キャンバスクリックでシーク
  wfCanvas.addEventListener('click', (e) => {
    if (!aBuf) return;
    const rect = wfCanvas.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    manualSeek(pos * aBuf.duration);
  });

  // ファイル名サニタイズ
  function sanitizeName(str) {
    return (str || "").trim().replace(/\.(wav|mp3|m4a|aac|ogg|flac)$/i, '').replace(/[\\/:*?"<>|]/g, '_');
  }

  function getSafeFilename() {
    let clean = sanitizeName(fnInput.value);
    return clean || "ringtone";
  }

  function updateFilenamePreview() {
    document.getElementById('fn-preview-txt').innerText = getSafeFilename() + ".wav";
  }

  function appendTag(tag) {
    let cur = getSafeFilename();
    if (!cur.endsWith(tag)) fnInput.value = cur + tag;
    updateFilenamePreview();
  }

  function appendDateTag() {
    const d = new Date();
    const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    let cur = getSafeFilename();
    if (!cur.includes(dateStr)) fnInput.value = cur + "_" + dateStr;
    updateFilenamePreview();
  }

  function resetFilename() {
    fnInput.value = (originalBaseName ? originalBaseName + "_ringtone" : "ringtone");
    updateFilenamePreview();
  }

  // 音声エクスポート
  async function exportAudio() {
    if (!aBuf) return;
    const dur = eT - sT;
    const sRate = aBuf.sampleRate;
    const oCtx = new OfflineAudioContext(1, Math.max(1, Math.floor(dur * sRate)), sRate);
    const src = oCtx.createBufferSource(); 
    src.buffer = aBuf;
    const gain = oCtx.createGain();
    gain.gain.setValueAtTime(1, 0);
    
    if (fade > 0) { 
      const fStart = Math.max(0, dur - fade);
      gain.gain.setValueAtTime(1, fStart); 
      gain.gain.linearRampToValueAtTime(0.0001, dur); 
    }
    
    src.connect(gain); 
    gain.connect(oCtx.destination);
    src.start(0, sT, dur);
    
    const rendered = await oCtx.startRendering();
    const wav = bufferToWav(rendered);
    const fileName = getSafeFilename() + ".wav";
    
    const a = document.createElement('a'); 
    a.href = URL.createObjectURL(new Blob([wav], {type:'audio/wav'})); 
    a.download = fileName; 
    a.click();
  }

  // WAV変換
  function bufferToWav(ab) {
    let n = 1, len = ab.length * 2 + 44, buf = new ArrayBuffer(len), view = new DataView(buf), pos = 0;
    const set16 = (d) => { view.setUint16(pos, d, true); pos += 2; };
    const set32 = (d) => { view.setUint32(pos, d, true); pos += 4; };
    
    set32(0x46464952); set32(len - 8); set32(0x45564157); set32(0x20746d66); set32(16); set16(1); set16(n);
    set32(ab.sampleRate); set32(ab.sampleRate * 2 * n); set16(n * 2); set16(16); set32(0x61746164); set32(len - pos - 4);
    
    const data = ab.getChannelData(0);
    for(let i=0; i<ab.length; i++) { 
      let s = Math.max(-1, Math.min(1, data[i])); 
      set16(s < 0 ? s * 0x8000 : s * 0x7FFF); 
    }
    return buf;
  }
